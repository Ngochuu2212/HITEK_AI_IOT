# Trình duyệt chỉ gọi một địa chỉ (cổng 3000), Nginx chuyển tiếp vào các service trong mạng
# Docker, nên không vướng CORS và Zone Service không cần bật CORS.
map $http_upgrade $connection_upgrade {
  default upgrade;
  ""      close;
}

server {
  listen 80;
  server_name _;
  root /usr/share/nginx/html;

  # Phân giải tên service lúc có request (DNS của Docker), để Nginx vẫn chạy khi một service
  # chưa bật, ví dụ ai-service nằm ở profile "ai".
  resolver 127.0.0.11 valid=10s ipv6=off;
  set $backend http://backend:5250;
  set $zone    http://zone-service:8010;
  set $ai      http://ai-service:8003;

  proxy_http_version 1.1;
  proxy_set_header Host $host;
  proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
  proxy_set_header X-Forwarded-Proto $scheme;

  location /api/v1/ {
    proxy_pass $backend;
    # Tải video lên làm nguồn camera (Backend giới hạn 300 MB).
    client_max_body_size 300m;
    proxy_read_timeout 300s;
  }

  # SignalR: WebSocket, có thể rơi về long polling.
  location /hubs/ {
    proxy_pass $backend;
    proxy_set_header Upgrade $http_upgrade;
    proxy_set_header Connection $connection_upgrade;
    proxy_read_timeout 1h;
  }

  # Zone Service: SSE kết quả AI, ảnh khung hình, MJPEG, bằng chứng. Tắt buffer để
  # luồng SSE/MJPEG tới trình duyệt ngay.
  location /zone/ {
    rewrite ^/zone/(.*)$ /$1 break;
    proxy_pass $zone;
    proxy_set_header Connection "";
    proxy_buffering off;
    proxy_cache off;
    proxy_read_timeout 1h;
  }

  location /ai/ {
    rewrite ^/ai/(.*)$ /$1 break;
    proxy_pass $ai;
  }

  location /assets/ {
    expires 7d;
    add_header Cache-Control "public, immutable";
  }

  # Ứng dụng một trang: mọi đường dẫn khác trả index.html cho React Router.
  location / {
    try_files $uri /index.html;
    add_header Cache-Control "no-cache";
  }
}
